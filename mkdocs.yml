site_name: Everything Sensor Docs
site_url: https://everything-sensor-docs.readthedocs.io/
repo_name: NohPei/Everything-Sensor-Docs
repo_url: https://github.com/NohPei/Everything-Sensor-Docs
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Hardware:
      - Components: Hardware/Components.md
  - Software:
      - Overview: Software/Overview.md
      - Board Setup: Software/Board-Setup.md
      - Data Logging: Software/Data-Logging.md
      - Networking: Software/Networking.md
  - Research Notes: Research-Notes.md
  - Versioning: Versioning.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
